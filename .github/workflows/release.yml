name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.3.10)'
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          fi

      - name: Build Plugin Archive
        run: |
          mkdir -p openid
          # Copy all relevant files, exclude .git, .github and the temp openid dir
          rsync -av --exclude='.git' --exclude='.github' --exclude='openid' ./ openid/
          zip -r openid-${{ env.VERSION }}.zip openid/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: openid-${{ env.VERSION }}.zip
          generate_release_notes: true
